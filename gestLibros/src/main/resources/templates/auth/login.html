<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GestLibros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .login-body {
            padding: 2rem;
            background: white;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-right: none;
        }
        .demo-credentials {
            background: #e8f4fd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #1890ff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="login-card">
                <div class="login-header">
                    <i class="fas fa-book fa-3x mb-3"></i>
                    <h1 class="h3">GestLibros</h1>
                    <p class="mb-0 opacity-75">Sistema de Gestión Bibliotecaria</p>
                </div>

                <div class="login-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Ingresa tu usuario" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Ingresa tu contraseña" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100 btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
                        </button>
                    </form>

                    <!-- Mensaje de error -->
                    <div id="errorMessage" class="alert alert-danger mt-3 d-none">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span id="errorText"></span>
                    </div>

                    <!-- Credenciales de demo -->
                    <div class="demo-credentials">
                        <h6 class="fw-bold mb-2"><i class="fas fa-info-circle me-2"></i>Credenciales de Demo:</h6>
                        <div class="row small">
                            <div class="col-6">
                                <strong>Admin:</strong><br>
                                Usuario: <code>admin</code><br>
                                Password: <code>admin123</code>
                            </div>
                            <div class="col-6">
                                <strong>Bibliotecario:</strong><br>
                                Usuario: <code>bibliotecario</code><br>
                                Password: <code>bib123</code>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-4">
                <small class="text-white opacity-75">
                    <i class="fas fa-code me-1"></i> Desarrollado con Spring Boot & Bootstrap
                </small>
            </div>
        </div>
    </div>
</div>

<script>
    // SIMULACIÓN TEMPORAL - Solo para probar el diseño
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const button = this.querySelector('button');

        // Mostrar loading
        button.disabled = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Verificando...';
        errorDiv.classList.add('d-none');

        // Simular delay de red
        setTimeout(() => {
            // Credenciales hardcodeadas para demo
            const validUsers = {
                'admin': 'admin123',
                'bibliotecario': 'bib123'
            };

            if (validUsers[username] && validUsers[username] === password) {
                // Login exitoso - redirigir (temporalmente a dashboard vacío)
                alert(' Login exitoso! Redirigiendo al dashboard...');
                window.location.href = '/web/';
            } else {
                // Mostrar error
                errorText.textContent = 'Usuario o contraseña incorrectos';
                errorDiv.classList.remove('d-none');

                // Efecto de shake en el formulario
                this.classList.add('shake');
                setTimeout(() => this.classList.remove('shake'), 500);
            }

            // Restaurar botón
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión';
        }, 1500); // Simular 1.5 segundos de delay
    });

    // Efecto de shake para errores
    const style = document.createElement('style');
    style.textContent = `
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
